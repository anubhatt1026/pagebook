<!DOCTYPE html>
<html>
    <head>
        <title>pagebook - Sign Up</title>
        <link rel="stylesheet" href="css/login.css">
        <link rel="icon" href="images/orgPagebook.png">
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body bgcolor=":#f2e6d2">
        <div class="login-wrap">
        <section class="login-art">
        <img src="images/pagebook-logo-no-bg.png" >
        <div>
            <h3>Anytime and Everytime.</h3>
        </div>
        <div class="big-space"></div>
            <small>Save and read samples.</small>
        </section>
        <section class="login-card">
            <div class="rectangle">
                <div id="container">
                    <input type="radio" name="tab" id="tab-signin" checked>
                    <input type="radio" name="tab" id="tab-signup" checked> 

                <div class="tabs">
                    <label for="tab-signin"><strong>Sign In</strong></label>
                    <label for="tab-signup"><strong>Sign Up</strong></label>
                </div>
<br>
            <form action="#" id="signup-form">

                <label for="Name"><strong>Name</strong></label>
                <input type="text" class="field" autocomplete="Name" required>
                
                <label for="Email"><strong>Email</strong></label>
                <input type="email" class="field" autocomplete="Email" required>
                
                <label for="Password"><strong>Password</strong></label>
                <input type="password" class="field" autocomplete="Password" required>
                <br>
                <div class="sub"><button type="submit"><strong>Sign-Up</strong></button></div>
            </form>
<br>                
                <form action="#" id="signin-form">
                        <label for="Email"><strong>Email</strong></label>
                        <input type="email" class="field" autocomplete="Email" required>
                
                        <label for="Password"><strong>Password</strong></label>
                        <input type="password" class="field" autocomplete="Password" required>
                        <br>
                        <div class="sub"><button type="submit"><strong>Sign-In</strong></button></div>
                </form>
                </div>
            </div>
    </section>
    </div>
        
    </body>
</html>
